<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vik's GamePage</title>
<style>
  :root{
    --ink:#14101d;
    --ink-2:#1b1528;
    --panel:#221a35;
    --edge:#37294f;
    --text:#f3edfb;
    --dim:#a294bf;
    --focus:#ffd166;

    --c-Racing:#ff6b57;
    --c-Sports:#3ddc97;
    --c-Platformer:#5bc8ff;
    --c-Puzzle:#ffd166;
    --c-Shooter:#ff4d8d;
    --c-Strategy:#b18cff;
    --c-Horror:#8a7bff;
    --c-Cooking:#ffa24c;
    --c-Multiplayer:#4de3d0;
    --c-Idle:#c4d84a;
    --c-Minecraft:#7bd66b;
    --c-Sandbox:#ff9ecb;
    --c-Arcade:#9fb0d0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- top bar ---------- */
  .bar{
    position:sticky;top:0;z-index:20;
    background:rgba(20,16,29,.88);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--edge);
  }
  .bar-in{
    max-width:1280px;margin:0 auto;
    padding:18px 20px 14px;
    display:grid;grid-template-columns:auto 1fr auto;
    gap:18px;align-items:center;
  }
  .wordmark{
    font-size:1.45rem;font-weight:800;letter-spacing:-.03em;
    display:flex;align-items:center;gap:9px;white-space:nowrap;
  }
  .wordmark b{
    display:inline-grid;place-items:center;
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(150deg,#ff6b57,#b18cff);
    color:#14101d;font-size:.95rem;font-weight:900;
  }
  .find{position:relative;display:flex;align-items:center}
  .find svg{position:absolute;left:16px;width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2}
  #q{
    width:100%;padding:13px 16px 13px 46px;
    font:inherit;font-size:1.02rem;
    color:var(--text);background:var(--ink-2);
    border:1px solid var(--edge);border-radius:12px;outline:none;
  }
  #q::placeholder{color:#6f6390}
  #q:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(255,209,102,.18)}
  .count{font-size:.85rem;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}

  /* ---------- filters ---------- */
  .chips{
    max-width:1280px;margin:0 auto;
    padding:0 20px 14px;
    display:flex;gap:8px;flex-wrap:wrap;
  }
  .chip{
    font:inherit;font-size:.83rem;font-weight:600;
    color:var(--dim);background:transparent;
    border:1px solid var(--edge);border-radius:999px;
    padding:6px 13px;cursor:pointer;
    display:flex;align-items:center;gap:7px;
  }
  .chip i{width:7px;height:7px;border-radius:50%;background:var(--dot,#9fb0d0);font-style:normal}
  .chip:hover{color:var(--text);border-color:#4b3a6b}
  .chip[aria-pressed="true"]{color:var(--ink);background:var(--text);border-color:var(--text)}
  .chip:focus-visible,#q:focus-visible,.card:focus-visible,.pin:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* ---------- layout ---------- */
  main{max-width:1280px;margin:0 auto;padding:26px 20px 70px}
  .section-head{
    display:flex;align-items:baseline;gap:12px;
    margin:0 0 14px;
  }
  .section-head h2{font-size:.95rem;font-weight:700;letter-spacing:-.01em}
  .section-head span{font-size:.8rem;color:var(--dim)}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(184px,1fr));
    gap:16px;
  }
  #pinned-wrap{margin-bottom:34px}
  #pinned-wrap.empty{display:none}
  hr.rule{border:0;border-top:1px solid var(--edge);margin:0 0 26px}

  /* ---------- card ---------- */
  .card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:14px;overflow:hidden;
    text-decoration:none;color:inherit;
    display:flex;flex-direction:column;
    transition:border-color .15s,transform .15s;
  }
  .card:hover{border-color:var(--accent,#6a53a0);transform:translateY(-3px)}
  .thumb{
    position:relative;aspect-ratio:4/3;width:100%;
    background:linear-gradient(135deg,#2b2142,#1a1329);
    display:grid;place-items:center;overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb img[data-broken]{display:none}
  .initials{
    font-size:2.1rem;font-weight:900;letter-spacing:-.05em;
    color:var(--accent,#9fb0d0);opacity:.92;
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  .thumb::after{
    content:"";position:absolute;inset:auto 0 0 0;height:3px;
    background:var(--accent,#9fb0d0);opacity:.85;
  }
  .meta{padding:11px 12px 13px;display:flex;flex-direction:column;gap:3px}
  .meta h3{font-size:.95rem;font-weight:650;letter-spacing:-.01em;line-height:1.25}
  .meta p{font-size:.76rem;color:var(--dim);display:flex;align-items:center;gap:6px}
  .tp{
    color:var(--ink);background:var(--accent,#9fb0d0);
    border-radius:4px;padding:0 4px;font-size:.66rem;font-weight:800;
  }
  .pin{
    position:absolute;top:8px;right:8px;z-index:2;
    width:30px;height:30px;border-radius:9px;
    border:1px solid var(--edge);background:rgba(20,16,29,.72);
    color:var(--dim);cursor:pointer;display:grid;place-items:center;
    font-size:.95rem;line-height:1;
  }
  .pin:hover{color:var(--focus)}
  .pin[aria-pressed="true"]{color:var(--focus);border-color:var(--focus)}

  /* ---------- empty ---------- */
  #empty{display:none;padding:56px 0;text-align:center}
  #empty p{color:var(--dim);font-size:1rem}
  #empty button{
    margin-top:14px;font:inherit;font-weight:600;cursor:pointer;
    color:var(--ink);background:var(--text);border:0;border-radius:10px;padding:9px 16px;
  }

  .hint{margin-top:44px;font-size:.78rem;color:#6f6390;text-align:center}
  kbd{
    background:var(--ink-2);border:1px solid var(--edge);border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;font:inherit;font-size:.72rem;color:var(--dim);
  }

  @media (max-width:720px){
    .bar-in{grid-template-columns:1fr auto;gap:12px 14px}
    .find{grid-column:1 / -1;order:3}
    .grid{grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
    .initials{font-size:1.6rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;scroll-behavior:auto}
    .card:hover{transform:none}
  }
</style>

<header class="bar">
  <div class="bar-in">
    <div class="wordmark"><b>GP</b>GamePage</div>
    <div class="find">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search 300 games — title or category">
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <section id="pinned-wrap" class="empty">
    <div class="section-head"><h2>Pinned</h2><span>your quick launches</span></div>
    <div class="grid" id="pinned"></div>
    <hr class="rule">
  </section>

  <section>
    <div class="section-head"><h2 id="all-head">All games</h2><span id="all-sub"></span></div>
    <div class="grid" id="grid"></div>
  </section>

  <div id="empty">
    <p>Nothing matches that search.</p>
    <button id="clear">Show all games</button>
  </div>

  <p class="hint">Press <kbd>/</kbd> to search · <kbd>Enter</kbd> launches the first result · <kbd>Esc</kbd> clears</p>
</main>

const FOLDER = "offline/";
const IMAGES = "images/";
const PIN_KEY = "gamepage.pinned";

const grid = document.getElementById("grid");
const pinnedGrid = document.getElementById("pinned");
const pinnedWrap = document.getElementById("pinned-wrap");
const chipsBox = document.getElementById("chips");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const allSub = document.getElementById("all-sub");
const q = document.getElementById("q");

let pinned = [];
try { pinned = JSON.parse(localStorage.getItem(PIN_KEY)) || []; } catch (e) { pinned = []; }
let activeCat = "All";

function savePins(){
  try { localStorage.setItem(PIN_KEY, JSON.stringify(pinned)); } catch (e) {}
}

function initials(title){
  const words = title.replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
  if (!words.length) return "??";
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

function card(g){
  const a = document.createElement("a");
  a.className = "card";
  a.href = FOLDER + g.f;
  a.style.setProperty("--accent", `var(--c-${g.c}, #9fb0d0)`);

  const img = new Image();
  img.src = IMAGES + g.s + ".PNG";
  img.alt = "";
  img.loading = "lazy";
  img.addEventListener("error", () => img.setAttribute("data-broken", ""));

  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const ini = document.createElement("span");
  ini.className = "initials";
  ini.textContent = initials(g.t);
  thumb.append(ini, img);

  const pin = document.createElement("button");
  pin.className = "pin";
  pin.type = "button";
  pin.title = "Pin to the top";
  pin.setAttribute("aria-label", "Pin " + g.t);
  const on = pinned.includes(g.s);
  pin.setAttribute("aria-pressed", on ? "true" : "false");
  pin.textContent = on ? "★" : "☆";
  pin.addEventListener("click", e => {
    e.preventDefault();
    const i = pinned.indexOf(g.s);
    if (i > -1) pinned.splice(i, 1); else pinned.unshift(g.s);
    savePins();
    render();
  });

  const meta = document.createElement("div");
  meta.className = "meta";
  const h3 = document.createElement("h3");
  h3.textContent = g.t;
  const p = document.createElement("p");
  p.textContent = g.c;
  if (g.p) {
    const tp = document.createElement("span");
    tp.className = "tp";
    tp.textContent = "2P";
    p.append(" ", tp);
  }
  meta.append(h3, p);

  a.append(pin, thumb, meta);
  return a;
}

function buildChips(){
  const cats = ["All", ...[...new Set(GAMES.map(g => g.c))].sort()];
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", c === activeCat ? "true" : "false");
    if (c !== "All") {
      const dot = document.createElement("i");
      dot.style.setProperty("--dot", `var(--c-${c}, #9fb0d0)`);
      b.append(dot);
    }
    b.append(document.createTextNode(c === "All" ? "All games" : c));
    b.addEventListener("click", () => {
      activeCat = c;
      [...chipsBox.children].forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      render();
    });
    chipsBox.append(b);
  });
}

function matches(g, term){
  if (activeCat !== "All" && g.c !== activeCat) return false;
  if (!term) return true;
  return (g.t + " " + g.c + " " + g.s).toLowerCase().includes(term);
}

let visible = [];

function render(){
  const term = q.value.toLowerCase().trim();
  visible = GAMES.filter(g => matches(g, term));

  grid.replaceChildren(...visible.map(card));

  const pins = pinned.map(s => GAMES.find(g => g.s === s)).filter(Boolean);
  pinnedWrap.classList.toggle("empty", pins.length === 0);
  if (pins.length) pinnedGrid.replaceChildren(...pins.map(card));

  emptyEl.style.display = visible.length ? "none" : "block";
  countEl.textContent = visible.length === GAMES.length
    ? GAMES.length + " games"
    : visible.length + " of " + GAMES.length;
  allSub.textContent = activeCat === "All" ? "" : activeCat.toLowerCase();
}

q.addEventListener("input", render);
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && visible.length) window.location.href = FOLDER + visible[0].f;
  if (e.key === "Escape") { q.value = ""; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});
document.getElementById("clear").addEventListener("click", () => {
  q.value = ""; activeCat = "All";
  [...chipsBox.children].forEach((x, i) => x.setAttribute("aria-pressed", i === 0 ? "true" : "false"));
  render();
  q.focus();
});

buildChips();
render();
</script>
</body>
</html>
